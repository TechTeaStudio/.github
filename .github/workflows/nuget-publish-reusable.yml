name: NuGet Publish (Reusable)

on:
  workflow_call:
    inputs:
      solution:
        description: Path to the .sln file
        required: true
        type: string
      projects_glob:
        description: Glob pattern for packable .csproj files (e.g. "source/*/*.csproj")
        required: true
        type: string
      skip_tests:
        description: Skip test step (for repos without test projects)
        required: false
        type: boolean
        default: false
    secrets:
      # No longer used. Kept optional so a caller that still passes it does not fail to start.
      NUGET_API_KEY:
        required: false

# This workflow builds, tests and packs. It does NOT push to nuget.org, and it cannot:
# nuget.org Trusted Publishing only accepts a login from a job defined in a workflow file of
# the package's own repository (the token's job_workflow_ref must start with
# <owner>/<repo>/.github/workflows/). A job of this shared file carries TechTeaStudio/.github
# there and is refused. So each repository's dotnet.yml has its own small publish job that
# downloads the "nupkg" artifact produced here, logs in with NuGet/login and pushes.
jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} --no-restore --configuration Release

      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: dotnet test ${{ inputs.solution }} --no-build --configuration Release --verbosity normal

      - name: Pack
        run: |
          mkdir -p artifacts
          for proj in ${{ inputs.projects_glob }}; do
            VERSION=$(grep -Po '(?<=<Version>)[^<]+' "$proj" || true)
            if [[ -z "$VERSION" ]]; then
              echo "Skipping $proj — no <Version> tag"
              continue
            fi
            echo "Packing $proj @ $VERSION"
            dotnet pack "$proj" \
              --configuration Release \
              --output ./artifacts \
              --no-build \
              /p:PackageVersion=$VERSION
          done

      # The packages (and symbol packages, where a project produces them) for the caller's
      # publish job. One day is plenty: that job runs right after this one.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
